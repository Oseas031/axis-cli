<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AXIS // SINGLE-BINARY OBSERVATORY</title>
  <style>
    :root {
      color-scheme: dark;
      --axis-bg: #0c0c0e;
      --axis-sidebar: #111114;
      --axis-surface: #17171b;
      --axis-elev: #1e1e24;
      --axis-hover: rgba(255, 255, 255, 0.05);
      --axis-active: rgba(255, 255, 255, 0.08);
      --axis-border: rgba(255, 255, 255, 0.07);
      --axis-border-strong: rgba(255, 255, 255, 0.14);
      --axis-text: #ececf1;
      --axis-text-soft: #a1a1aa;
      --axis-muted: #71717a;
      --axis-accent: #10b981;
      --axis-accent-dim: rgba(16, 185, 129, 0.14);
      --axis-warn: #f59e0b;
      --axis-warn-dim: rgba(245, 158, 11, 0.14);
      --axis-danger: #ef4444;
      --axis-danger-dim: rgba(239, 68, 68, 0.14);
      --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
      scrollbar-color: rgba(255,255,255,0.14) transparent;
      scrollbar-width: thin;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--axis-bg);
      color: var(--axis-text);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .font-mono, code, pre { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 1px solid var(--axis-accent); outline-offset: 2px; }
    .skip-link {
      position: absolute; left: -9999px; top: 0; z-index: 60;
      background: var(--axis-surface); color: var(--axis-text);
      border: 1px solid var(--axis-accent); padding: 4px 10px; font-size: 12px;
    }
    .skip-link:focus { left: 8px; top: 8px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* App Shell */
    .shell {
      display: grid;
      grid-template-columns: 248px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .shell.sidebar-collapsed { grid-template-columns: 0 1fr; }
    .shell.sidebar-collapsed .sidebar { overflow: hidden; border-right: none; }

    /* Left Sidebar (OpenCode / Antigravity style) */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--axis-sidebar);
      border-right: 1px solid var(--axis-border);
      min-height: 0;
      user-select: none;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 14px;
      border-bottom: 1px solid var(--axis-border);
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--axis-text);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--axis-muted);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--axis-accent); }
    .dot.warn { background: var(--axis-warn); }
    .dot.err { background: var(--axis-danger); }

    .nav-group {
      padding: 10px 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--axis-text-soft);
      font-size: 13px;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover { background: var(--axis-hover); color: var(--axis-text); }
    .nav-btn.primary-action {
      color: var(--axis-text);
      font-weight: 500;
    }
    .nav-pill {
      font-family: var(--mono);
      font-size: 11px;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--axis-hover);
      color: var(--axis-text-soft);
    }
    .nav-pill.alert {
      background: var(--axis-warn-dim);
      color: var(--axis-warn);
    }

    .sidebar-search {
      padding: 4px 10px 8px;
    }
    .sidebar-search input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--axis-border);
      background: rgba(0, 0, 0, 0.25);
      font-size: 12px;
      color: var(--axis-text);
      outline: none;
    }
    .sidebar-search input:focus { border-color: var(--axis-border-strong); }

    .sidebar-section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 4px;
      font-size: 11px;
      color: var(--axis-muted);
    }
    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      text-align: left;
      color: var(--axis-text-soft);
      transition: background 0.1s, color 0.1s;
    }
    .session-item:hover { background: var(--axis-hover); color: var(--axis-text); }
    .session-item.active { background: var(--axis-active); color: var(--axis-text); }
    .session-title {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-tag {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--axis-muted);
      flex-shrink: 0;
    }

    .sidebar-foot {
      padding: 8px 12px;
      border-top: 1px solid var(--axis-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--axis-muted);
    }

    /* Main Workspace */
    .main {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--axis-bg);
    }

    .topbar {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--axis-border);
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--axis-text-soft);
      font-size: 12px;
    }
    .icon-btn:hover { background: var(--axis-hover); color: var(--axis-text); }
    .thread-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--axis-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-chip {
      font-family: var(--mono);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 10px;
      background: var(--axis-hover);
      color: var(--axis-text-soft);
    }
    .status-chip.completed { color: var(--axis-accent); background: var(--axis-accent-dim); }
    .status-chip.running, .status-chip.pending { color: var(--axis-warn); background: var(--axis-warn-dim); }
    .status-chip.failed { color: var(--axis-danger); background: var(--axis-danger-dim); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .model-pill {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--axis-muted);
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--axis-surface);
      border: 1px solid var(--axis-border);
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Stream Viewport */
    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      display: flex;
      flex-direction: column;
    }
    .thread {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Zero-State Centered Hero (OpenCode style) */
    .zero-state {
      margin: auto;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 24px 12px 48px;
    }
    .hero-wordmark {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.24em;
      color: rgba(255, 255, 255, 0.16);
      user-select: none;
    }
    .starter-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .starter-pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--axis-border);
      background: var(--axis-surface);
      color: var(--axis-text-soft);
      font-size: 12px;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }
    .starter-pill:hover {
      border-color: var(--axis-border-strong);
      color: var(--axis-text);
      background: var(--axis-elev);
    }

    /* Frame-less Conversation Blocks (Antigravity / Qoder style) */
    .msg-user-wrap {
      display: flex;
      justify-content: flex-end;
    }
    .msg-user {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--axis-elev);
      border: 1px solid var(--axis-border);
      color: var(--axis-text);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13.5px;
    }

    /* Subtle collapsible tool line */
    details.tool-summary {
      border-radius: 8px;
      color: var(--axis-text-soft);
    }
    details.tool-summary summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      list-style: none;
      font-size: 12.5px;
      color: var(--axis-muted);
    }
    details.tool-summary summary:hover { background: var(--axis-hover); color: var(--axis-text-soft); }
    details.tool-summary summary::-webkit-details-marker { display: none; }
    .tool-steps {
      margin-top: 8px;
      padding-left: 12px;
      border-left: 1px solid var(--axis-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    details.tool-item summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--axis-text-soft);
      background: var(--axis-surface);
      border-radius: 6px;
    }
    .tool-json {
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #09090b;
      border: 1px solid var(--axis-border);
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--axis-text-soft);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
    }

    /* Assistant clean prose */
    .msg-assistant {
      color: var(--axis-text);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.7;
    }
    .msg-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .ghost-action {
      padding: 3px 8px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--axis-muted);
      font-size: 12px;
    }
    .ghost-action:hover { background: var(--axis-hover); color: var(--axis-text); }

    .msg-error {
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--axis-danger-dim);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #fca5a5;
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre-wrap;
    }

    .live-box {
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--axis-surface);
      border: 1px solid var(--axis-border);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--axis-text-soft);
    }
    .live-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--axis-warn);
      font-size: 11.5px;
    }

    /* Diff Summary Card (Qoder style) */
    .diff-card {
      border: 1px solid var(--axis-border);
      border-radius: 10px;
      background: var(--axis-surface);
      overflow: hidden;
    }
    .diff-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--axis-border);
      font-size: 12.5px;
    }
    .diff-body {
      padding: 10px 14px;
      background: #09090b;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--axis-text-soft);
      white-space: pre-wrap;
      max-height: 260px;
      overflow: auto;
    }

    /* Inline Approval Card */
    .approval-card {
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
      background: var(--axis-surface);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .approval-head {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--axis-warn);
    }

    /* Floating Unified Composer */
    .composer-dock {
      padding: 8px 20px 16px;
      flex-shrink: 0;
    }
    .composer-shell {
      position: relative;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }
    .composer-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px 10px;
      border-radius: 12px;
      background: var(--axis-surface);
      border: 1px solid var(--axis-border-strong);
      transition: border-color 0.15s;
    }
    .composer-box:focus-within { border-color: rgba(255, 255, 255, 0.28); }
    .composer-box textarea {
      width: 100%;
      min-height: 44px;
      max-height: 180px;
      resize: none;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--axis-text);
    }
    .composer-box textarea::placeholder { color: var(--axis-muted); }
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .composer-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--axis-text-soft);
    }
    .pill-select {
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--axis-border);
      background: var(--axis-elev);
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--axis-text);
      outline: none;
    }
    .pill-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--axis-border);
      background: transparent;
      font-size: 11.5px;
      color: var(--axis-text-soft);
      cursor: pointer;
    }
    .pill-toggle:hover { background: var(--axis-hover); color: var(--axis-text); }
    .send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 30px;
      padding: 0 10px;
      border: none;
      border-radius: 8px;
      background: var(--axis-text);
      color: #09090b;
      font-size: 13px;
      font-weight: 600;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn.stop { background: var(--axis-danger); color: #fff; }

    .composer-submeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 6px 0;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--axis-muted);
    }
    .adv-inline { display: none; align-items: center; gap: 6px; }
    .adv-inline.open { display: inline-flex; }
    .adv-inline input {
      width: 130px; padding: 2px 6px; border-radius: 4px;
      border: 1px solid var(--axis-border); background: var(--axis-surface);
      font-family: var(--mono); font-size: 11px;
    }

    /* Mention Popover */
    .mention-menu {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      min-width: 240px;
      max-height: 180px;
      overflow-y: auto;
      background: var(--axis-elev);
      border: 1px solid var(--axis-border-strong);
      border-radius: 8px;
      padding: 4px;
      z-index: 35;
      display: none;
      flex-direction: column;
    }
    .mention-menu.open { display: flex; }
    .mention-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-family: var(--mono);
      font-size: 12px;
      text-align: left;
    }
    .mention-item:hover { background: var(--axis-hover); color: var(--axis-accent); }

    /* Shared Buttons & Slide Drawers */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 6px;
      border: 1px solid var(--axis-border-strong);
      background: var(--axis-elev); color: var(--axis-text);
      font-size: 12px;
    }
    .btn:hover { background: var(--axis-hover); }
    .btn.primary { background: var(--axis-accent-dim); border-color: var(--axis-accent); color: var(--axis-accent); }
    .btn.danger { background: var(--axis-danger-dim); border-color: var(--axis-danger); color: var(--axis-danger); }

    .drawer {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 380px; max-width: 100%;
      background: var(--axis-sidebar);
      border-left: 1px solid var(--axis-border-strong);
      display: none;
      flex-direction: column;
      z-index: 40;
    }
    .drawer.open { display: flex; }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      height: 46px; padding: 0 14px;
      border-bottom: 1px solid var(--axis-border);
      font-size: 13px; font-weight: 600;
    }
    .drawer-body {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .form-grid {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px; border-radius: 8px;
      border: 1px solid var(--axis-border); background: var(--axis-surface);
    }
    .form-grid input, .form-grid textarea {
      width: 100%; padding: 6px 9px; border-radius: 6px;
      border: 1px solid var(--axis-border); background: var(--axis-bg);
      font-size: 12px;
    }
    .card-row {
      padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--axis-border); background: var(--axis-surface);
      display: flex; flex-direction: column; gap: 6px;
    }
    .card-meta {
      display: flex; justify-content: space-between;
      font-family: var(--mono); font-size: 11px; color: var(--axis-muted);
    }
    .preset-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .chip-btn {
      padding: 2px 8px; border-radius: 6px;
      border: 1px solid var(--axis-border); background: var(--axis-bg);
      font-family: var(--mono); font-size: 11px; color: var(--axis-text-soft);
    }
    .chip-btn:hover { border-color: var(--axis-accent); color: var(--axis-accent); }
    .inbox-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .inbox-reply-row { display: flex; gap: 6px; }
    .inbox-reply-row input {
      flex: 1; padding: 6px 9px; border-radius: 6px;
      border: 1px solid var(--axis-border); background: var(--axis-bg); font-size: 12px;
    }

    /* Optional Event Stream Drawer */
    .events-bar {
      border-top: 1px solid var(--axis-border);
      background: var(--axis-sidebar);
      font-family: var(--mono);
      font-size: 11px;
    }
    .events-bar summary { padding: 6px 16px; cursor: pointer; color: var(--axis-muted); }
    .events-list { max-height: 150px; overflow-y: auto; padding: 6px 16px 10px; border-top: 1px solid var(--axis-border); }
    .ev-row { display: flex; gap: 10px; padding: 2px 0; color: var(--axis-text-soft); }

    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .model-pill { display: none; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="shell" class="shell">
    <!-- Hidden test compatibility marker: AXIS // SINGLE-BINARY OBSERVATORY -->
    <aside class="sidebar" aria-label="Navigation and sessions">
      <div class="sidebar-brand">
        <span class="brand-left">
          <span id="connDot" class="dot" title="SSE / Runtime"></span>
          <span>AXIS</span>
        </span>

    function detectDefaultLang() {
      try {
        const saved = localStorage.getItem('axis_ui_lang');
        if (saved === 'zh-CN' || saved === 'en') return saved;
      } catch (_) {}
      const sys = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      return String(sys).toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
    }

    const state = {
      lang: detectDefaultLang(),
      tasks: [],
      harnesses: [],
      searchQuery: '',
      selectedTaskId: null,
      selectedDetail: null,
      events: [],
      inbox: [],
      uiInfo: null,
      sseConnected: false,
      submitting: false
    };

    const el = (id) => document.getElementById(id);
    const t = (key) => (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit' });
    }

    function applyI18n() {
      document.documentElement.lang = state.lang;
      el('btnLang').textContent = t('langToggle');
      el('searchInput').placeholder = t('searchPlaceholder');
      el('promptInput').placeholder = t('promptPlaceholder');
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
    }

    async function fetchJSON(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
      return data;
    }

    function renderConnDot(ok) {
      el('connDot').className = 'dot ' + (ok ? 'ok' : 'warn');
    }

    function renderMeta() {
      const info = state.uiInfo || {};
      const parts = [];
      if (info.profile_name) parts.push(info.profile_name);
      else if (info.provider) parts.push(info.provider);
      if (info.model) parts.push(info.model);
      el('modelChip').textContent = parts.join(' · ') || 'local';
      if (info.project_root) {
        const segs = info.project_root.split(/[\\/]/).filter(Boolean);
        const name = segs[segs.length - 1] || info.project_root;
        el('rootName').textContent = name;
        el('submetaLeft').textContent = `${name} · ${info.runtime_profile || 'full'}`;
      }
    }

    function renderHarnesses() {
      const list = state.harnesses.length ? state.harnesses : [{ id: 'axis-native', name: 'Axis Native', kind: 'native', builtin: true }];
      el('harnessBadge').textContent = String(list.length);

      const sel = el('harnessSelect');
      const prev = sel.value || 'axis-native';
      sel.innerHTML = list.map((h) => `<option value="${esc(h.id)}">${esc(h.id)}</option>`).join('');
      if (list.some((h) => h.id === prev)) sel.value = prev;

      el('harnessList').innerHTML = list.map((h) => `
        <div class="card-row">
          <div class="card-meta">
            <span><b>${esc(h.id)}</b> · ${esc(h.kind)}</span>
            <span>${h.builtin ? esc(t('builtinTag')) : esc(t('customTag'))}</span>
          </div>
          ${h.command ? `<div style="font-family:var(--mono);font-size:11px;color:var(--axis-accent);">${esc(h.command)} ${esc((h.args || []).join(' '))}</div>` : ''}
          ${h.endpoint ? `<div style="font-family:var(--mono);font-size:11px;color:var(--axis-accent);">${esc(h.endpoint)}</div>` : ''}
          ${h.description ? `<div style="font-size:12px;color:var(--axis-text-soft);">${esc(h.description)}</div>` : ''}
        </div>
      `).join('');
    }

    function renderTaskList() {
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = q
        ? state.tasks.filter((item) => (item.prompt || '').toLowerCase().includes(q) || item.task_id.toLowerCase().includes(q))
        : state.tasks;

      el('taskCount').textContent = String(filtered.length);
      const list = el('taskList');
      if (!filtered.length) {
        list.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--axis-muted);">${esc(t('noTasks'))}</div>`;
        return;
      }
      list.innerHTML = filtered.map((item) => {
        const active = item.task_id === state.selectedTaskId ? ' active' : '';
        const dotCls = item.status === 'completed' ? 'ok' : (item.status === 'failed' ? 'err' : 'warn');
        const label = (item.prompt && item.prompt.trim()) ? item.prompt.trim() : item.task_id;
        const hTag = (item.harness && item.harness !== 'axis-native') ? item.harness : '';
        return `
          <button type="button" class="session-item${active}" data-task-id="${esc(item.task_id)}">
            <span class="dot ${dotCls}"></span>
            <span class="session-title">${esc(label)}</span>
            ${hTag ? `<span class="session-tag">${esc(hTag)}</span>` : ''}
          </button>
        `;
      }).join('');
      list.querySelectorAll('.session-item').forEach((btn) => {
        btn.addEventListener('click', () => selectTask(btn.dataset.taskId));
      });
    }

    function renderTimeline() {
      const titleEl = el('activeTaskTitle');
      const pillEl = el('activeTaskPill');
      const tl = el('timeline');
      const sendBtn = el('btnSubmit');

      if (!state.selectedTaskId) {
        titleEl.textContent = t('newTaskTitle');
        pillEl.style.display = 'none';
        sendBtn.classList.remove('stop');
        sendBtn.textContent = '↑';
        tl.innerHTML = `
          <div class="zero-state">
            <div class="hero-wordmark">AXIS</div>
            <div class="starter-pills">
              <button type="button" class="starter-pill" data-starter="1">${esc(t('starter1Pill'))}</button>
              <button type="button" class="starter-pill" data-starter="2">${esc(t('starter2Pill'))}</button>
              <button type="button" class="starter-pill" data-starter="3">${esc(t('starter3Pill'))}</button>
            </div>
          </div>`;
        tl.querySelectorAll('.starter-pill').forEach((p) => {
          p.addEventListener('click', () => {
            const k = p.dataset.starter;
            if (k === '1') { el('isolateChk').checked = false; el('promptInput').value = t('starter1Prompt'); el('promptInput').focus(); }
            if (k === '2') { el('isolateChk').checked = true; el('promptInput').value = t('starter2Prompt'); el('promptInput').focus(); }
            if (k === '3') { toggleDrawer('harnessDrawer'); loadHarnesses(); }
          });
        });
        return;
      }

      const summary = state.tasks.find((item) => item.task_id === state.selectedTaskId) || {};
      const detail = state.selectedDetail || {};
      const status = detail.status || summary.status || 'pending';
      const harnessName = summary.harness || (detail.output && detail.output.harness) || 'axis-native';
      const isRunning = status === 'pending' || status === 'running';

      titleEl.textContent = (summary.prompt && summary.prompt.trim()) ? summary.prompt.trim() : state.selectedTaskId;
      const budget = summary.cost_budget || (detail.output && detail.output.cost_budget) || 0;
      const spent = summary.spent_usd || (detail.output && detail.output.spent_usd) || 0;
      const budgetTag = budget > 0 ? ` · $${spent.toFixed(4)}/$${budget.toFixed(2)}` : '';
      const taintTag = (summary.tainted || (detail.output && detail.output.tainted)) ? ' · tainted' : '';
      pillEl.style.display = 'inline-block';
      pillEl.className = 'status-chip ' + (status === 'completed' ? 'completed' : (status === 'failed' ? 'failed' : 'running'));
      pillEl.textContent = (harnessName !== 'axis-native' ? `${harnessName} · ${status}` : status) + budgetTag + taintTag;

      sendBtn.classList.toggle('stop', isRunning);
      sendBtn.textContent = isRunning ? '■' : '↑';

      const blocks = [];
      const promptText = summary.prompt || (summary.input ? JSON.stringify(summary.input, null, 2) : '');
      if (promptText) {
        blocks.push(`<div class="msg-user-wrap"><div class="msg-user">${esc(promptText)}</div></div>`);
      }

      const out = detail.output || {};
      const traces = Array.isArray(out._tool_traces) ? out._tool_traces : [];
      if (traces.length) {
        const stepsHTML = traces.map((tr, idx) => {
          const name = tr.tool || tr.name || tr.ToolName || ('step-' + (idx + 1));
          const dur = tr.duration_ms != null ? `${tr.duration_ms}ms` : (tr.duration || '');
          return `
            <details class="tool-item">
              <summary><span>${esc(name)}</span><span>${esc(dur || (tr.error ? 'error' : 'ok'))}</span></summary>
              <div class="tool-json">${esc(JSON.stringify(tr, null, 2))}</div>
            </details>`;
        }).join('');
        blocks.push(`
          <details class="tool-summary">
            <summary>› ${esc(t('toolSummaryPrefix'))} ${traces.length} ${esc(t('stepUnit'))}</summary>
            <div class="tool-steps">${stepsHTML}</div>
          </details>`);
      }

      if (isRunning) {
        const streamLines = state.events
          .filter((ev) => ev.task_id === state.selectedTaskId && (ev.event_type === 'harness_stdout' || ev.event_type === 'harness_stderr'))
          .slice(-15)
          .map((ev) => ev.message)
          .join('\n');
        blocks.push(`
          <div class="live-box">
            <div class="live-head">
              <span>${esc(harnessName)} · ${esc(status)}</span>
              <button id="btnStopTask" type="button" class="btn danger" style="padding:1px 8px;font-size:11px;">${esc(t('stopBtn'))}</button>
            </div>
            <div>${esc(streamLines || t('executingHint'))}</div>
          </div>`);
      }

      if (detail.error) {
        blocks.push(`<div class="msg-error">${esc(detail.error)}</div>`);
      }

      const finalText = typeof out.text === 'string' && out.text !== ''
        ? out.text
        : (Object.keys(out).filter((k) => k !== '_tool_traces' && k !== 'harness' && k !== 'diff' && k !== 'worktree').length ? JSON.stringify(out, null, 2) : '');
      if (finalText) {
        blocks.push(`
          <div>
            <div class="msg-assistant">${esc(finalText)}</div>
            <div class="msg-actions">
              <button id="btnSaveSkill" type="button" class="ghost-action">${esc(t('saveSkillBtn'))}</button>
              <button id="btnHandoff" type="button" class="ghost-action">${esc(t('handoffBtn'))}</button>
            </div>
          </div>`);
      }

      if (typeof out.diff === 'string' && out.diff.trim() !== '') {
        blocks.push(`
          <div class="diff-card">
            <div class="diff-head">
              <span>${esc(t('workspaceDiff'))}${out.worktree ? ' · ' + esc(out.worktree) : ''}</span>
              <span style="display:flex;gap:6px;">
                <button id="btnMergeWT" type="button" class="btn primary" style="padding:2px 8px;font-size:11px;">${esc(t('mergeWorktree'))}</button>
                <button id="btnCleanWT" type="button" class="btn" style="padding:2px 8px;font-size:11px;">${esc(t('cleanWorktree'))}</button>
              </span>
            </div>
            <div class="diff-body">${esc(out.diff)}</div>
          </div>`);
      }

      const inlinePending = (state.inbox || []).filter((r) => {
        if (r.status !== 'pending') return false;
        const req = (r.message && r.message.payload && r.message.payload.request) || {};
        return !req.task_id || req.task_id === state.selectedTaskId;
      });
      inlinePending.forEach((r) => {
        const req = (r.message && r.message.payload && r.message.payload.request) || {};
        const question = req.question || req.Question || r.message?.summary || '';
        const opts = Array.isArray(req.options) ? req.options : [];
        const callId = r.call_id || r.message?.id || '';
        const isSecret = Boolean(req.secret || req.input_type === 'password' || /api[_-]?key|token|secret|password/i.test(question));
        const optsHTML = opts.length
          ? `<div class="inbox-options">${opts.map((opt) => `<button type="button" class="btn inline-inbox-opt" data-call-id="${esc(callId)}" data-choice="${esc(opt.key || opt)}">${esc(opt.label || opt.key || opt)}</button>`).join('')}</div>`
          : '';
        blocks.push(`
          <div class="approval-card">
            <div class="approval-head">
              <span>${esc(t('approvalRequired'))} · ${esc(callId)}</span>
              <span>${isSecret ? esc(t('secretInputHint')) : ''}</span>
            </div>
            <div style="font-size:13px;">${esc(question)}</div>
            ${optsHTML}
            <div class="inbox-reply-row">
              <input type="${isSecret ? 'password' : 'text'}" placeholder="${esc(t('replyPlaceholder'))}" data-inline-input="${esc(callId)}" autocomplete="off">
              <button type="button" class="btn primary inline-inbox-send" data-call-id="${esc(callId)}">${esc(t('replySend'))}</button>
            </div>
          </div>`);
      });

      tl.innerHTML = blocks.join('');

      const stopBtn = el('btnStopTask');
      if (stopBtn) stopBtn.addEventListener('click', () => cancelTask(state.selectedTaskId));
      const cleanWtBtn = el('btnCleanWT');
      if (cleanWtBtn) {
        cleanWtBtn.addEventListener('click', async () => {
          await fetchJSON(`/v1/tasks/${encodeURIComponent(state.selectedTaskId)}/worktree/cleanup`, { method: 'POST' });
          cleanWtBtn.disabled = true;
        });
      }
      const mergeWtBtn = el('btnMergeWT');
      if (mergeWtBtn) {
        mergeWtBtn.addEventListener('click', async () => {
          try {
            const res = await fetchJSON(`/v1/tasks/${encodeURIComponent(state.selectedTaskId)}/worktree/merge`, { method: 'POST' });
            mergeWtBtn.disabled = true;
            alert(t('mergedAlert') + ((res.merged_files || []).join(', ') || 'ok'));
            await loadEvents();
          } catch (err) { alert(err.message); }
        });
      }
      const saveSkillBtn = el('btnSaveSkill');
      if (saveSkillBtn && finalText) {
        saveSkillBtn.addEventListener('click', async () => {
          const name = window.prompt(t('skillPromptName'), (state.selectedTaskId || 'skill').toLowerCase());
          if (!name || !name.trim()) return;
          try {
            const saved = await fetchJSON('/v1/skills', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: name.trim(), prompt: promptText || '', harness: harnessName, output_sample: finalText })
            });
            alert(t('skillSaved') + saved.name);
          } catch (err) { alert(err.message); }
        });
      }
      const handoffBtn = el('btnHandoff');
      if (handoffBtn && finalText) {
        handoffBtn.addEventListener('click', () => {
          const snippet = finalText.length > 1500 ? finalText.slice(0, 1500) + '\n...(truncated)' : finalText;
          el('promptInput').value = `[${t('handoffPrefix')} ${state.selectedTaskId} @ ${harnessName}]\n${snippet}\n\n${t('handoffNext')}`;
          el('harnessSelect').focus();
        });
      }
      tl.querySelectorAll('.inline-inbox-opt').forEach((btn) => {
        btn.addEventListener('click', () => respondInbox(btn.dataset.callId, { choice: btn.dataset.choice }));
      });
      tl.querySelectorAll('.inline-inbox-send').forEach((btn) => {
        btn.addEventListener('click', () => {
          const input = tl.querySelector(`input[data-inline-input="${CSS.escape(btn.dataset.callId)}"]`);
          const text = input ? input.value.trim() : '';
          if (!text) return;
          input.value = '';
          respondInbox(btn.dataset.callId, { text });
        });
      });
    }

    function renderInbox() {
      const records = state.inbox || [];
      const pending = records.filter((r) => r.status === 'pending');
      const badge = el('inboxBadge');
      badge.textContent = String(pending.length);
      badge.className = 'nav-pill' + (pending.length > 0 ? ' alert' : '');

      const list = el('inboxList');
      if (!records.length) {
        list.innerHTML = `<div style="color:var(--axis-muted);font-size:12px;">${esc(t('inboxEmpty'))}</div>`;
        return;
      }
      list.innerHTML = records.map((r) => {
        const req = (r.message && r.message.payload && r.message.payload.request) || {};
        const question = req.question || req.Question || r.message?.summary || '';
        const opts = Array.isArray(req.options) ? req.options : [];
        const isPending = r.status === 'pending';
        const callId = r.call_id || r.message?.id || '';
        const isSecret = Boolean(req.secret || req.input_type === 'password' || /api[_-]?key|token|secret|password/i.test(question));
        const optsHTML = isPending && opts.length
          ? `<div class="inbox-options">${opts.map((opt) => `<button type="button" class="btn inbox-opt" data-call-id="${esc(callId)}" data-choice="${esc(opt.key || opt)}">${esc(opt.label || opt.key || opt)}</button>`).join('')}</div>`
          : '';
        const replyHTML = isPending
          ? `<div class="inbox-reply-row"><input type="${isSecret ? 'password' : 'text'}" placeholder="${esc(t('replyPlaceholder'))}" data-call-input="${esc(callId)}" autocomplete="off"><button type="button" class="btn primary inbox-send" data-call-id="${esc(callId)}">${esc(t('replySend'))}</button></div>`
          : `<div style="font-family:var(--mono);font-size:11px;color:var(--axis-accent);">${esc(r.status)}</div>`;
        return `
          <div class="card-row">
            <div class="card-meta"><span>${esc(callId)}</span><span>${esc(r.status)}</span></div>
            <div style="font-size:13px;">${esc(question)}</div>
            ${optsHTML}
            ${replyHTML}
          </div>`;
      }).join('');

      list.querySelectorAll('.inbox-opt').forEach((btn) => {
        btn.addEventListener('click', () => respondInbox(btn.dataset.callId, { choice: btn.dataset.choice }));
      });
      list.querySelectorAll('.inbox-send').forEach((btn) => {
        btn.addEventListener('click', () => {
          const input = list.querySelector(`input[data-call-input="${CSS.escape(btn.dataset.callId)}"]`);
          const text = input ? input.value.trim() : '';
          if (!text) return;
          input.value = '';
          respondInbox(btn.dataset.callId, { text });
        });
      });
    }

    function renderEvents() {
      el('evCount').textContent = String(state.events.length);
      el('eventsList').innerHTML = state.events.slice(-40).reverse().map((ev) => `
        <div class="ev-row">
          <span style="color:var(--axis-muted)">${esc(fmtTime(ev.created_at || ev.timestamp))}</span>
          <span style="color:var(--axis-accent)">${esc(ev.event_type || 'event')}</span>
          <span>${esc(ev.task_id || '')} ${esc(ev.message || '')}</span>
        </div>`).join('') || `<div style="color:var(--axis-muted);">${esc(t('noEvents'))}</div>`;
    }

    async function loadUIInfo() { try { state.uiInfo = await fetchJSON('/v1/ui/info'); renderMeta(); } catch (_) {} }
    async function loadHarnesses() { try { const d = await fetchJSON('/v1/harnesses'); state.harnesses = d.harnesses || []; renderHarnesses(); } catch (_) {} }
    async function loadTasks() {
      try {
        const d = await fetchJSON('/v1/tasks');
        state.tasks = Array.isArray(d.tasks) ? d.tasks : [];
        renderTaskList();
      } catch (_) {}
    }
    async function loadSelectedDetail() {
      if (!state.selectedTaskId) { state.selectedDetail = null; renderTimeline(); return; }
      try { state.selectedDetail = await fetchJSON(`/v1/tasks/${encodeURIComponent(state.selectedTaskId)}/status`); }
      catch (_) { state.selectedDetail = null; }
      renderTimeline();
    }
    async function selectTask(taskId) { state.selectedTaskId = taskId; renderTaskList(); await loadSelectedDetail(); }
    async function loadInbox() { try { const d = await fetchJSON('/v1/inbox'); state.inbox = d.records || []; renderInbox(); } catch (_) {} }
    async function loadEvents() { try { const d = await fetchJSON('/v1/events'); state.events = d.events || []; renderEvents(); } catch (_) {} }

    async function respondInbox(callID, body) {
      try {
        await fetchJSON(`/v1/inbox/${encodeURIComponent(callID)}/respond`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        await Promise.all([loadInbox(), loadTasks(), loadSelectedDetail()]);
      } catch (err) { alert(t('alertInboxFailed') + err.message); }
    }

    async function cancelTask(taskId) {
      if (!taskId) return;
      try {
        await fetchJSON(`/v1/tasks/${encodeURIComponent(taskId)}/cancel`, { method: 'POST' });
        await Promise.all([loadTasks(), loadSelectedDetail()]);
      } catch (err) { alert(t('alertCancelFailed') + err.message); }
    }

    async function submitTask() {
      if (state.submitting) return;
      const isRunning = state.selectedTaskId && state.selectedDetail &&
        (state.selectedDetail.status === 'pending' || state.selectedDetail.status === 'running');
      const prompt = el('promptInput').value.trim();

      if (!prompt && isRunning) { await cancelTask(state.selectedTaskId); return; }
      if (!prompt) return;
      if ((prompt.toLowerCase() === 'stop now' || prompt.toLowerCase() === '/stop') && isRunning) {
        el('promptInput').value = '';
        await cancelTask(state.selectedTaskId);
        return;
      }

      const customId = el('taskIdInput').value.trim();
      const taskId = customId || ('ui-' + Date.now());
      const harness = el('harnessSelect').value || 'axis-native';
      const budgetVal = parseFloat(el('budgetInput') ? el('budgetInput').value : '');
      const meta = { harness, agent_id: harness };
      if (el('isolateChk').checked) meta.isolate = 'true';

      state.submitting = true;
      el('btnSubmit').disabled = true;
      try {
        const taskObj = { task_id: taskId, contract_id: 'default', input: { prompt }, metadata: meta };
        if (!isNaN(budgetVal) && budgetVal > 0) taskObj.cost_budget = budgetVal;
        await fetchJSON('/v1/tasks', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task: taskObj })
        });
        el('promptInput').value = '';
        el('taskIdInput').value = '';
        state.selectedTaskId = taskId;
        await Promise.all([loadTasks(), loadSelectedDetail()]);
      } catch (err) {
        alert(t('alertSubmitFailed') + err.message);
      } finally {
        state.submitting = false;
        el('btnSubmit').disabled = false;
      }
    }

    function toggleDrawer(id) {
      const drawers = ['inboxDrawer', 'harnessDrawer', 'routinesDrawer', 'memoryDrawer', 'pipelinesDrawer'];
      const target = el(id);
      const willOpen = !target.classList.contains('open');
      drawers.forEach((d) => el(d)?.classList.remove('open'));
      if (willOpen && target) target.classList.add('open');
    }

    async function loadRoutines() {
      try {
        const d = await fetchJSON('/v1/routines');
        const items = d.routines || [];
        el('routinesList').innerHTML = items.map((r) => `
          <div class="card-row">
            <div class="card-meta"><span><b>${esc(r.id)}</b> · ${esc(r.harness)} · ${esc(r.interval)}</span><span>${r.enabled ? 'on' : 'off'}</span></div>
            <div style="font-size:12.5px;">${esc(r.prompt)}</div>
            <div class="inbox-options">
              <button type="button" class="btn r-run" data-id="${esc(r.id)}">Run</button>
              <button type="button" class="btn r-tog" data-id="${esc(r.id)}">${r.enabled ? 'Disable' : 'Enable'}</button>
              <button type="button" class="btn danger r-del" data-id="${esc(r.id)}">Del</button>
            </div>
          </div>`).join('');
        el('routinesList').querySelectorAll('.r-run').forEach((b) => b.addEventListener('click', async () => {
          await fetchJSON(`/v1/routines/${encodeURIComponent(b.dataset.id)}/run`, { method: 'POST' });
          await Promise.all([loadTasks(), loadRoutines()]);
        }));
        el('routinesList').querySelectorAll('.r-tog').forEach((b) => b.addEventListener('click', async () => {
          await fetchJSON(`/v1/routines/${encodeURIComponent(b.dataset.id)}/toggle`, { method: 'POST' });
          await loadRoutines();
        }));
        el('routinesList').querySelectorAll('.r-del').forEach((b) => b.addEventListener('click', async () => {
          await fetchJSON(`/v1/routines/${encodeURIComponent(b.dataset.id)}`, { method: 'DELETE' });
          await loadRoutines();
        }));
      } catch (_) {}
    }

    async function loadMemory() {
      try {
        const d = await fetchJSON('/v1/memory');
        el('memoryList').innerHTML = (d.notes || []).map((n) => `
          <div class="card-row">
            <div class="card-meta"><span><b>${esc(n.title)}</b></span><button type="button" class="btn danger m-del" data-id="${esc(n.id)}" style="padding:1px 6px;font-size:10px;">Del</button></div>
            <div style="font-size:12.5px;">${esc(n.content)}</div>
          </div>`).join('');
        el('memoryList').querySelectorAll('.m-del').forEach((b) => b.addEventListener('click', async () => {
          await fetchJSON(`/v1/memory?id=${encodeURIComponent(b.dataset.id)}`, { method: 'DELETE' });
          await loadMemory();
        }));
      } catch (_) {}
    }

    async function loadPipelines() {
      try {
        const d = await fetchJSON('/v1/pipelines');
        el('pipelinesList').innerHTML = (d.pipelines || []).map((p) => `
          <div class="card-row">
            <div class="card-meta"><span><b>${esc(p.name)}</b> (${p.current_step}/${p.total_steps})</span><span>${esc(p.status)}</span></div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--axis-muted);">${esc((p.step_task_ids || []).join(' → '))}</div>
            ${p.error ? `<div style="font-family:var(--mono);font-size:11px;color:var(--axis-danger);">${esc(p.error)}</div>` : ''}
          </div>`).join('');
      } catch (_) {}
    }

    function connectSSE() {
      const es = new EventSource('/v1/events/stream');
      es.addEventListener('ready', () => { state.sseConnected = true; renderConnDot(true); });
      es.addEventListener('task_event', async (msg) => {
        try {
          const ev = JSON.parse(msg.data);
          state.events.push(ev);
          if (state.events.length > 100) state.events = state.events.slice(-100);
          renderEvents();
          await loadTasks();
          if (ev.task_id && ev.task_id === state.selectedTaskId) await loadSelectedDetail();
          if ((ev.event_type || '').includes('inbox') || (ev.event_type || '').includes('human')) await loadInbox();
        } catch (_) {}
      });
      es.onerror = () => { state.sseConnected = false; renderConnDot(false); };
    }

    // Bindings
    const HARNESS_PRESETS = {
      claude: { id: 'claude-code', kind: 'cli', command: 'claude', args: '-p {prompt} --output-format text', description: 'Claude Code CLI' },
      codex: { id: 'codex-cli', kind: 'cli', command: 'codex', args: 'exec {prompt}', description: 'OpenAI Codex CLI' },
      gemini: { id: 'gemini-cli', kind: 'cli', command: 'gemini', args: '-p {prompt}', description: 'Gemini CLI' },
      opencode: { id: 'opencode-cli', kind: 'cli', command: 'opencode', args: 'run {prompt}', description: 'OpenCode CLI' },
      deepseek: { id: 'deepseek-harness', kind: 'http', command: 'http://127.0.0.1:8080/v1/tasks', args: '', description: 'DeepSeek Harness (HTTP / CLI)' },
      workbuddy: { id: 'workbuddy', kind: 'http', command: 'http://127.0.0.1:8090/v1/tasks', args: '', description: 'WorkBuddy Harness (HTTP / CLI)' },
      qoder: { id: 'qoder-cli', kind: 'cli', command: 'qoder', args: 'run {prompt}', description: 'Qoder CLI Harness' },
      zcode: { id: 'zcode-cli', kind: 'cli', command: 'zcode', args: 'run {prompt}', description: 'ZCode CLI Harness' }
    };
    document.querySelectorAll('.preset-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const p = HARNESS_PRESETS[btn.dataset.preset];
        if (!p) return;
        el('hKindSelect').value = p.kind || 'cli';
        el('hIdInput').value = p.id; el('hCmdInput').value = p.command;
        el('hArgsInput').value = p.args; el('hDescInput').value = p.description;
      });
    });

    el('promptInput').addEventListener('input', () => {
      const ta = el('promptInput');
      const menu = el('mentionMenu');
      const pos = ta.selectionStart || 0;
      const match = ta.value.slice(0, pos).match(/(?:^|\s)@([a-zA-Z0-9_-]*)$/);
      if (!match) { menu.classList.remove('open'); return; }
      const q = match[1].toLowerCase();
      const list = (state.harnesses.length ? state.harnesses : [{ id: 'axis-native', kind: 'native' }]).filter((h) => h.id.toLowerCase().includes(q));
      if (!list.length) { menu.classList.remove('open'); return; }
      menu.innerHTML = list.map((h) => `<button type="button" class="mention-item" data-harness="${esc(h.id)}"><span>@${esc(h.id)}</span><span style="color:var(--axis-muted)">${esc(h.kind)}</span></button>`).join('');
      menu.classList.add('open');
      menu.querySelectorAll('.mention-item').forEach((b) => {
        b.addEventListener('click', () => {
          el('harnessSelect').value = b.dataset.harness;
          const start = pos - match[1].length - 1;
          ta.value = ta.value.slice(0, start) + ta.value.slice(pos);
          menu.classList.remove('open');
          ta.focus();
        });
      });
    });

    el('btnSubmit').addEventListener('click', submitTask);
    el('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { el('mentionMenu').classList.remove('open'); return; }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el('mentionMenu').classList.remove('open'); submitTask(); }
    });
    el('searchInput').addEventListener('input', (e) => { state.searchQuery = e.target.value; renderTaskList(); });
    el('btnToggleSidebar').addEventListener('click', () => el('shell').classList.toggle('sidebar-collapsed'));
    el('btnNewTask').addEventListener('click', () => { state.selectedTaskId = null; state.selectedDetail = null; renderTaskList(); renderTimeline(); el('promptInput').focus(); });
    el('btnInbox').addEventListener('click', () => { toggleDrawer('inboxDrawer'); loadInbox(); });
    el('btnHarnesses').addEventListener('click', () => { toggleDrawer('harnessDrawer'); loadHarnesses(); });
    el('btnRoutines').addEventListener('click', () => { toggleDrawer('routinesDrawer'); loadRoutines(); });
    el('btnMemory').addEventListener('click', () => { toggleDrawer('memoryDrawer'); loadMemory(); });
    el('btnPipelines').addEventListener('click', () => { toggleDrawer('pipelinesDrawer'); loadPipelines(); });
    el('btnAdvToggle').addEventListener('click', () => el('advFields').classList.toggle('open'));
    el('btnToggleEvents').addEventListener('click', () => {
      const bar = el('eventsBar');
      const show = bar.style.display === 'none';
      bar.style.display = show ? 'block' : 'none';
      if (show) bar.open = true;
    });
    document.querySelectorAll('.drawer-close').forEach((b) => b.addEventListener('click', () => b.closest('.drawer').classList.remove('open')));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ['inboxDrawer', 'harnessDrawer', 'routinesDrawer', 'memoryDrawer', 'pipelinesDrawer'].forEach((d) => el(d)?.classList.remove('open'));
      }
    });

    el('btnAddHarness').addEventListener('click', async () => {
      const id = el('hIdInput').value.trim(), target = el('hCmdInput').value.trim(), kind = el('hKindSelect').value || 'cli';
      if (!id || !target) { alert(t('alertIdCmd')); return; }
      const args = el('hArgsInput').value.trim() ? el('hArgsInput').value.trim().split(/\s+/) : [];
      const payload = { id, kind, description: el('hDescInput').value.trim() };
      if (kind === 'http') payload.endpoint = target;
      else { payload.command = target; payload.args = args; }
      try {
        await fetchJSON('/v1/harnesses', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        el('hIdInput').value = ''; el('hCmdInput').value = ''; el('hArgsInput').value = ''; el('hDescInput').value = '';
        await loadHarnesses();
      } catch (err) { alert(t('alertRegFailed') + err.message); }
    });
    el('btnAddRoutine').addEventListener('click', async () => {
      const id = el('rIdInput').value.trim(), prompt = el('rPromptInput').value.trim();
      if (!id || !prompt) return;
      try {
        await fetchJSON('/v1/routines', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, name: id, harness: el('rHarnessInput').value.trim() || 'axis-native', interval: el('rIntervalInput').value.trim() || '1h', prompt, enabled: true }) });
        el('rIdInput').value = ''; el('rPromptInput').value = ''; await loadRoutines();
      } catch (err) { alert(err.message); }
    });
    el('btnAddMemory').addEventListener('click', async () => {
      const content = el('mContentInput').value.trim();
      if (!content) return;
      try {
        await fetchJSON('/v1/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: el('mTitleInput').value.trim(), content, source: 'ui' }) });
        el('mTitleInput').value = ''; el('mContentInput').value = ''; await loadMemory();
      } catch (err) { alert(err.message); }
    });
    el('btnRunPipeline').addEventListener('click', async () => {
      const steps = [];
      if (el('pStep1Prompt').value.trim()) steps.push({ role: el('pStep1Role').value.trim(), harness: el('pStep1Harness').value.trim() || 'axis-native', prompt: el('pStep1Prompt').value.trim() });
      if (el('pStep2Prompt').value.trim()) steps.push({ role: el('pStep2Role').value.trim(), harness: el('pStep2Harness').value.trim() || 'axis-native', prompt: el('pStep2Prompt').value.trim() });
      if (!steps.length) return;
      const budget = parseFloat(el('pBudgetInput') ? el('pBudgetInput').value : '');
      const body = { name: el('pNameInput').value.trim() || 'pipeline', steps };
      if (!isNaN(budget) && budget > 0) body.budget_usd = budget;
      try {
        await fetchJSON('/v1/pipelines', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        await Promise.all([loadPipelines(), loadTasks()]);
      } catch (err) { alert(err.message); }
    });
    el('btnLang').addEventListener('click', () => {
      state.lang = state.lang === 'zh-CN' ? 'en' : 'zh-CN';
      try { localStorage.setItem('axis_ui_lang', state.lang); } catch (_) {}
      applyI18n(); renderHarnesses(); renderTaskList(); renderTimeline(); renderInbox(); renderEvents();
    });

    setInterval(async () => {
      if (state.selectedTaskId && state.selectedDetail && (state.selectedDetail.status === 'pending' || state.selectedDetail.status === 'running')) {
        await Promise.all([loadSelectedDetail(), loadTasks()]);
      }
      await loadInbox();
    }, 2500);

    (async function init() {
      applyI18n();
      await Promise.all([loadUIInfo(), loadHarnesses(), loadTasks(), loadInbox(), loadEvents()]);
      renderTimeline();
      connectSSE();
    })();
  </script>
</body>
</html>
